workflows:
  Android-Build-With-OTA:
    name: Android Release Build + GitHub OTA
    environment:
      node: 20
      java: 17
      vars:
        YARN_IGNORE_ENGINES: 1
    scripts:
      # 1️⃣ Clean workspace
      - name: Clean previous OTA and Android build files
        script: |
          rm -rf ota
          mkdir -p ota
          cd android
          ./gradlew clean
          cd ..

      # 2️⃣ Install dependencies
      - name: Install dependencies
        script: |
          echo "Installing dependencies..."
          if [ -f yarn.lock ]; then
            yarn install --network-timeout 600000
          else
            npm install
          fi

      # 3️⃣ Generate OTA JS bundle
      - name: Generate OTA bundle
        script: |
          echo "Creating OTA update bundle..."
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output ota/update.jsbundle \
            --assets-dest ota/
          echo "✅ JS bundle generated in ota/update.jsbundle"

      # 4️⃣ Create manifest.json
      - name: Generate OTA manifest
        script: |
          VERSION=$(date +%s)
          echo "{ \"version\": \"$VERSION\", \"bundle\": \"update.jsbundle\" }" > ota/manifest.json
          echo "✅ Created manifest.json with version $VERSION"

      # 5️⃣ Deploy OTA files to GitHub Pages
      - name: Publish OTA to GitHub Pages
        script: |
          echo "Deploying OTA update to GitHub Pages..."
          npm install -g gh-pages
          mkdir -p deploy
          cp ota/update.jsbundle deploy/
          cp ota/manifest.json deploy/
          npx gh-pages -d deploy \
            -r https://github.com/Kavahardik/CodeMagic_OTA_Demo.git \
            -b Code_Magic_OTA_Hardik
          echo "✅ OTA update deployed successfully to GitHub Pages"

      # 6️⃣ Build Android Release APK
      - name: Build Android Release APK
        script: |
          echo "Building Android release APK..."
          cd android
          ./gradlew assembleRelease
          cd ..
          echo "✅ Android release build complete"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - ota/update.jsbundle
      - ota/manifest.json

    publishing:
      email:
        recipients:
          - "hardik.k@digipay.guru"
  Android-Build:
    name: Android Release Build
    environment:
      vars:
        NPM_TOKEN: $NPM_TOKEN
        YARN_IGNORE_ENGINES: 1
    scripts:
      - name: Clean stray yarn files (if any)
        script: |
          rm -f /Users/builder/package.json /Users/builder/yarn.lock
      - name: Clean Android Project
        script: |
          cd android
          ./gradlew clean
          cd ..

      - name: Debug native_modules.gradle
        script: |
          if [ -f node_modules/@react-native-community/cli-platform-android/native_modules.gradle ]; then
            echo "native_modules.gradle exists"
            head -n 401 node_modules/@react-native-community/cli-platform-android/native_modules.gradle | tail -n 20
          else
            echo "native_modules.gradle does not exist"
            exit 1
          fi

      - name: Create Android Build
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - "hardik.k@digipay.guru"

  Android-Build-With-AppCenter-OTA:
    name: Android Build + App Center OTA
    environment:
      vars:
        NPM_TOKEN: $NPM_TOKEN
        YARN_IGNORE_ENGINES: 1
        APPCENTER_ACCESS_TOKEN: $APPCENTER_ACCESS_TOKEN
        MOBILE_CENTER_CURRENT_APP: dev-digipay.guru/DGePay-Merchant

    scripts:
      # 1️⃣ Clean stray files
      - name: Clean stray yarn files
        script: |
          rm -f /Users/builder/package.json /Users/builder/yarn.lock

      # 2️⃣ Setup npm and install dependencies
      - name: Setup .npmrc and Install Dependencies
        script: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          yarn install

      # 3️⃣ Install App Center CLI locally
      - name: Install App Center CLI
        script: |
          yarn add --dev appcenter-cli

      # 4️⃣ Generate JS Bundle
      - name: Generate JS Bundle
        script: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # 5️⃣ Publish CodePush OTA Update
      - name: Publish OTA Update to App Center
        script: |
          APP_VERSION=$(grep versionName android/app/build.gradle | head -1 | awk '{print $2}' | tr -d '"')
          echo "Releasing CodePush update for version $APP_VERSION"
          npx appcenter codepush release \
            --app "$MOBILE_CENTER_CURRENT_APP" \
            --update-contents-path android/app/src/main \
            --deployment-name Production \
            --target-binary-version "$APP_VERSION" \
            --description "JS bundle update" \
            --token "$APPCENTER_ACCESS_TOKEN"

      # 6️⃣ Clean Android project
      - name: Clean Android Project
        script: |
          cd android
          ./gradlew clean
          cd ..

      # 7️⃣ Build Android APK
      - name: Create Android Build (APK)
        script: |
          cd android
          ./gradlew assembleRelease
          cd ..

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - "hardik.k@digipay.guru"
