workflows:
  Android-Build-With-OTA:
    name: Android Release Build + GitHub RELEASES OTA
    environment:
      node: 20
      java: 17
      vars:
        YARN_IGNORE_ENGINES: 1
        OTA_OUTPUT: ota-build
        OTA_VERSION: "ota-1.0.1"           # Tag name like ota-1.0.1
        GITHUB_TOKEN: $FINAL_GITHUB_TOKEN  # Set this as secure env var in Codemagic

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ota-*"
          include: true

    scripts:
      # 1️⃣ Clean workspace
      - name: Clean previous OTA and Android build files
        script: |
          echo "🔍 Token length: ${#GITHUB_TOKEN}"
          echo "🧹 Cleaning workspace..."
          rm -rf $OTA_OUTPUT
          mkdir -p $OTA_OUTPUT
          cd android
          ./gradlew clean
          cd ..
          echo "✅ Clean complete."

      # 2️⃣ Install dependencies
      - name: Install dependencies
        script: |
          echo "📦 Installing dependencies..."
          if [ -f yarn.lock ]; then
            yarn install --network-timeout 600000
          else
            npm install
          fi
          echo "✅ Dependencies installed."

      # 3️⃣ Generate OTA JS bundle (index.android.bundle)
      - name: Generate OTA bundle
        script: |
          echo "⚙️ Creating OTA bundle..."
          mkdir -p $OTA_OUTPUT
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output $OTA_OUTPUT/index.android.bundle \
            --assets-dest $OTA_OUTPUT

          if [ ! -f "$OTA_OUTPUT/index.android.bundle" ]; then
            echo "❌ ERROR: index.android.bundle not found!"
            ls -la $OTA_OUTPUT
            exit 1
          fi
          echo "✅ JS bundle generated: $OTA_OUTPUT/index.android.bundle"

      # 4️⃣ Update manifest.json for GitHub Releases OTA
      - name: Generate OTA manifest
        script: |
          echo "🧾 Generating OTA manifest for version: $OTA_VERSION"
          node ota/updateManifest.js "$OTA_VERSION" "$OTA_OUTPUT/index.android.bundle"
          echo "✅ Updated ota/manifest.json:"
          cat ota/manifest.json

      # 5️⃣ Authenticate GitHub CLI
      - name: Authenticate GitHub CLI
        script: |
          echo "🔐 Authenticating GitHub CLI..."
          echo "$GITHUB_TOKEN" | gh auth login --with-token
          gh auth status

      # 6️⃣ Create or update GitHub Release and upload OTA assets
      - name: Publish OTA to GitHub Releases
        script: |
          echo "🚀 Publishing OTA to GitHub Releases with tag: $OTA_VERSION"

          # Ensure we are in the repo root
          git status

          # Create release if it doesn't exist
          gh release create "$OTA_VERSION" --title "$OTA_VERSION" --notes "OTA JS update" || echo "ℹ️ Release already exists, will update assets."

          echo "📤 Uploading bundle and manifest.json to release..."
          gh release upload "$OTA_VERSION" \
            "$OTA_OUTPUT/index.android.bundle" \
            "ota/manifest.json" \
            --clobber

          echo "✅ OTA assets uploaded to GitHub Release:"
          echo "   https://github.com/Kavahardik/CodeMagic_OTA_Demo/releases/tag/$OTA_VERSION"

      # 7️⃣ Build Android Release APK (optional but kept from your original)
      - name: Build Android Release APK
        script: |
          echo "🏗️ Building Android release APK..."
          cd android
          ./gradlew assembleRelease
          cd ..
          echo "✅ Android release build complete."

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - ota-build/index.android.bundle
      - ota/manifest.json



  Android-Build:
    name: Android Release Build
    environment:
      vars:
        NPM_TOKEN: $NPM_TOKEN
        YARN_IGNORE_ENGINES: 1
    scripts:
      - name: Clean stray yarn files (if any)
        script: |
          rm -f /Users/builder/package.json /Users/builder/yarn.lock
      - name: Clean Android Project
        script: |
          cd android
          ./gradlew clean
          cd ..

      - name: Debug native_modules.gradle
        script: |
          if [ -f node_modules/@react-native-community/cli-platform-android/native_modules.gradle ]; then
            echo "native_modules.gradle exists"
            head -n 401 node_modules/@react-native-community/cli-platform-android/native_modules.gradle | tail -n 20
          else
            echo "native_modules.gradle does not exist"
            exit 1
          fi

      - name: Create Android Build
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - "hardik.k@digipay.guru"


  Android-Build-With-AppCenter-OTA:
    name: Android Build + App Center OTA
    environment:
      vars:
        NPM_TOKEN: $NPM_TOKEN
        YARN_IGNORE_ENGINES: 1
        APPCENTER_ACCESS_TOKEN: $APPCENTER_ACCESS_TOKEN
        MOBILE_CENTER_CURRENT_APP: dev-digipay.guru/DGePay-Merchant

    scripts:
      # 1️⃣ Clean stray files
      - name: Clean stray yarn files
        script: |
          rm -f /Users/builder/package.json /Users/builder/yarn.lock

      # 2️⃣ Setup npm and install dependencies
      - name: Setup .npmrc and Install Dependencies
        script: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          yarn install

      # 3️⃣ Install App Center CLI locally
      - name: Install App Center CLI
        script: |
          yarn add --dev appcenter-cli

      # 4️⃣ Generate JS Bundle
      - name: Generate JS Bundle
        script: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # 5️⃣ Publish CodePush OTA Update
      - name: Publish OTA Update to App Center
        script: |
          APP_VERSION=$(grep versionName android/app/build.gradle | head -1 | awk '{print $2}' | tr -d '"')
          echo "Releasing CodePush update for version $APP_VERSION"
          npx appcenter codepush release \
            --app "$MOBILE_CENTER_CURRENT_APP" \
            --update-contents-path android/app/src/main \
            --deployment-name Production \
            --target-binary-version "$APP_VERSION" \
            --description "JS bundle update" \
            --token "$APPCENTER_ACCESS_TOKEN"

      # 6️⃣ Clean Android project
      - name: Clean Android Project
        script: |
          cd android
          ./gradlew clean
          cd ..

      # 7️⃣ Build Android APK
      - name: Create Android Build (APK)
        script: |
          cd android
          ./gradlew assembleRelease
          cd ..

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - "hardik.k@digipay.guru"
